name: Finalize FRIDAY sensory feature recovery

on:
  push:
    branches:
      - agent/complete-hardening-0.9.31

permissions:
  contents: write

concurrency:
  group: friday-sensory-feature-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature recovery branch
        uses: actions/checkout@v7
        with:
          ref: agent/complete-hardening-0.9.31
          fetch-depth: 0

      - name: Wire XCamera, workspaces, and visual commands
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'PATCH ANCHOR NOT FOUND: {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          # FRIDAY brain: deterministic visual routing always runs before generic cloud dialogue.
          patch(
              'app/src/main/java/com/seongja/jarvis/JarvisBrain.kt',
              '    private val capabilityRouter = FridayCapabilityRouter(appContext)\n',
              '    private val visionRouter = FridayVisionRouter(appContext)\n'
              '    private val capabilityRouter = FridayCapabilityRouter(appContext)\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/JarvisBrain.kt',
              '        capabilityRouter.intercept(input, memory.summary(), onCortexToken)?.let { return it }\n',
              '        visionRouter.intercept(input, memory.summary(), onCortexToken)?.let { return it }\n'
              '        capabilityRouter.intercept(input, memory.summary(), onCortexToken)?.let { return it }\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/JarvisBrain.kt',
              'OPERATIONS CORE // 0.9.24',
              'OPERATIONS CORE // 0.10.0 // SENSORY CORE'
          )

          # Main activity: HELIX buttons open real native workspaces; XCamera returns its result to voice + terminal.
          patch(
              'app/src/main/java/com/seongja/jarvis/MainActivity.kt',
              '        hud.isLongClickable = false\n',
              '        hud.setWorkspaceListener(::openWorkspace)\n'
              '        hud.isLongClickable = false\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/MainActivity.kt',
              '        WeatherRuntime.refresh()\n        if (hasMicPermission() && !brainBusy.get()) {\n',
              '        WeatherRuntime.refresh()\n'
              '        consumeXCameraResult()\n'
              '        if (hasMicPermission() && !brainBusy.get()) {\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/MainActivity.kt',
              '    private fun handlePartialSpeech(text: String) {\n',
              '''    private fun openWorkspace(workspace: String) {
                  when (workspace.trim().lowercase(Locale.US)) {
                      "xcamera", "vision", "eyes" -> XCameraActivity.launch(this, autoScan = false)
                      "image", "visual", "studio" -> ImageGenerationActivity.launch(this, "")
                      "diary" -> PrivateDiaryActivity.launch(this)
                      "memory", "vault" -> MemoryVaultActivity.launch(this)
                      "control", "permissions" -> startActivity(Intent(this, PermissionCenterActivity::class.java))
                      "apis", "cortex" -> startActivity(Intent(this, CloudConfigActivity::class.java))
                      else -> hud.pushEvent("WORKSPACE -> UNKNOWN ${workspace.take(32).uppercase(Locale.US)}")
                  }
              }

              private fun consumeXCameraResult() {
                  val result = XCameraRuntime.consume() ?: return
                  val response = BrainResponse(
                      spoken = result.description,
                      display = buildString {
                          appendLine(if (result.isError) "X-CAMERA // DEGRADED" else "X-CAMERA // VISUAL ANALYSIS VERIFIED")
                          appendLine("QUESTION // ${result.question.take(320)}")
                          appendLine("MODEL // ${result.model}")
                          appendLine("TIME // ${result.elapsedMs}MS")
                          append(result.description)
                      },
                      intent = if (result.isError) "vision/error" else "vision/result",
                      confidence = if (result.isError) 0f else .97f,
                      mode = if (result.isError) BrainMode.ALERT else BrainMode.ONLINE,
                      trace = listOf(
                          "workspace=x_camera",
                          "model=${result.model}",
                          "latency=${result.elapsedMs}ms",
                          "capture_persistence=disabled"
                      ),
                      memory = brain.memorySnapshot(),
                      thoughts = listOf("A temporary camera frame was analyzed and discarded."),
                      entities = listOf("sensor=xcamera"),
                      decision = if (result.isError) "report_xcamera_error" else "return_visual_analysis",
                      action = BrainAction()
                  )
                  hud.submitBrainResponse(response)
                  hud.pushEvent(if (result.isError) "X-CAMERA -> DEGRADED" else "X-CAMERA -> RESULT VERIFIED")
                  if (!result.isError) mainHandler.postDelayed({ if (resumed) speak(result.description) }, 280L)
              }

              private fun handlePartialSpeech(text: String) {
              '''
          )

          # Native HELIX bridge: workspace controls are real actions, not decorative labels.
          patch(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '    private var coreTapListener: (() -> Unit)? = null\n',
              '    private var coreTapListener: (() -> Unit)? = null\n'
              '    private var workspaceListener: ((String) -> Unit)? = null\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '    fun setCoreTapListener(listener: () -> Unit) {\n        coreTapListener = listener\n    }\n',
              '    fun setCoreTapListener(listener: () -> Unit) {\n'
              '        coreTapListener = listener\n'
              '    }\n\n'
              '    fun setWorkspaceListener(listener: (String) -> Unit) {\n'
              '        workspaceListener = listener\n'
              '    }\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '        coreTapListener = null\n',
              '        coreTapListener = null\n        workspaceListener = null\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '''        @JavascriptInterface
                      fun onCoreTap() {
                          post {
                              if (!released) {
                                  performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                                  coreTapListener?.invoke()
                              }
                          }
                      }
                  }
              ''',
              '''        @JavascriptInterface
                      fun onCoreTap() {
                          post {
                              if (!released) {
                                  performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                                  coreTapListener?.invoke()
                              }
                          }
                      }

                      @JavascriptInterface
                      fun openWorkspace(workspace: String) {
                          val clean = workspace.replace(Regex("[^A-Za-z0-9_-]"), "").take(32)
                          if (clean.isBlank()) return
                          post {
                              if (!released) {
                                  performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                                  dispatchEvent("WORKSPACE -> ${clean.uppercase(Locale.US)}", "SYS")
                                  workspaceListener?.invoke(clean)
                              }
                          }
                      }
                  }
              '''
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              'FridayHelix/0.9.31',
              'FridayHelix/0.10.0'
          )

          # Web bridge and UI props.
          patch(
              'helix-ui/src/nativeBridge.ts',
              '      onCoreTap: () => void\n      onHelixError?: (message: string) => void\n',
              '      onCoreTap: () => void\n'
              '      openWorkspace: (workspace: string) => void\n'
              '      onHelixError?: (message: string) => void\n'
          )
          patch(
              'helix-ui/src/nativeBridge.ts',
              '    tapCore: () => window.JarvisAndroid?.onCoreTap(),\n',
              '    tapCore: () => window.JarvisAndroid?.onCoreTap(),\n'
              '    openWorkspace: (workspace: string) => window.JarvisAndroid?.openWorkspace?.(workspace),\n'
          )
          patch(
              'helix-ui/src/App.tsx',
              '        onCoreTap={bridge.tapCore}\n',
              '        onCoreTap={bridge.tapCore}\n'
              '        onOpenWorkspace={bridge.openWorkspace}\n'
          )
          patch(
              'helix-ui/src/Hud.tsx',
              '  onCoreTap: () => void\n',
              '  onCoreTap: () => void\n  onOpenWorkspace: (workspace: string) => void\n'
          )
          patch(
              'helix-ui/src/Hud.tsx',
              '      <Header mode={props.mode} theme={theme} telemetry={props.telemetry} bridgeReady={props.bridgeReady} />\n      <main className="ops-main">\n',
              '      <Header mode={props.mode} theme={theme} telemetry={props.telemetry} bridgeReady={props.bridgeReady} />\n'
              '      <WorkspaceDock onOpen={props.onOpenWorkspace} bridgeReady={props.bridgeReady} />\n'
              '      <main className="ops-main">\n'
          )
          patch(
              'helix-ui/src/Hud.tsx',
              'function Header({\n',
              '''function WorkspaceDock({ onOpen, bridgeReady }: { onOpen: (workspace: string) => void; bridgeReady: boolean }) {
                  const workspaces = [
                      ['xcamera', 'X-CAMERA', 'VISION'],
                      ['image', 'VISUAL LAB', 'CREATE'],
                      ['diary', 'PRIVATE DIARY', 'WRITE'],
                      ['memory', 'MEMORY VAULT', 'RECALL'],
                      ['control', 'CONTROL', 'ANDROID'],
                  ]
                  return (
                      <nav className="workspace-dock" aria-label="FRIDAY operational workspaces">
                          {workspaces.map(([id, label, meta]) => (
                              <button key={id} type="button" disabled={!bridgeReady} onClick={() => onOpen(id)}>
                                  <span>{label}</span><small>{meta}</small>
                              </button>
                          ))}
                      </nav>
                  )
              }

              function Header({
              '''
          )
          patch(
              'helix-ui/src/Hud.tsx',
              'SEONGJA PRIVATE INTELLIGENCE <span>//</span> BUILD 0.9.31',
              'SEONGJA PRIVATE INTELLIGENCE <span>//</span> BUILD 0.10.0'
          )

          # Image generation must catch the exact requests that previously produced fake text promises.
          patch(
              'app/src/main/java/com/seongja/jarvis/FridayCapabilityRouter.kt',
              '    private val creationVerb = Regex("\\\\b(create|generate|make|draw|design|render|produce|illustrate|paint)\\\\b", RegexOption.IGNORE_CASE)\n'
              '    private val visualNoun = Regex("\\\\b(image|picture|photo|wallpaper|poster|logo|art|artwork|illustration|graphic|thumbnail|cover)\\\\b", RegexOption.IGNORE_CASE)\n',
              '    private val creationVerb = Regex("\\\\b(create|generate|make|draw|design|render|produce|illustrate|paint|visuali[sz]e|model|show)\\\\b", RegexOption.IGNORE_CASE)\n'
              '    private val visualNoun = Regex("\\\\b(image|picture|photo|wallpaper|poster|logo|art|artwork|illustration|graphic|thumbnail|cover|visual|scene|concept|diagram|3d\\\\s+model|model)\\\\b", RegexOption.IGNORE_CASE)\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/FridayCapabilityRouter.kt',
              '.replace(Regex("(?i)^\\\\s*(please\\\\s+)?(create|generate|make|draw|design|render|produce|illustrate|paint)\\\\s+"), "")\n',
              '.replace(Regex("(?i)^\\\\s*(please\\\\s+)?(create|generate|make|draw|design|render|produce|illustrate|paint|visualize|visualise|model|show me)\\\\s+"), "")\n'
          )
          patch(
              'app/src/main/java/com/seongja/jarvis/FridayCapabilityRouter.kt',
              '.replace(Regex("(?i)^(an?|the)\\\\s+(image|picture|photo|wallpaper|poster|logo|artwork?|illustration|graphic|thumbnail|cover)\\\\s+(of|for|showing)?\\\\s*"), "")\n',
              '.replace(Regex("(?i)^(an?|the)\\\\s+(image|picture|photo|wallpaper|poster|logo|artwork?|illustration|graphic|thumbnail|cover|visual|scene|concept|diagram|3d\\\\s+model|model)\\\\s+(of|for|showing)?\\\\s*"), "")\n'
          )

          # Fit the new live workspace rail into HELIX.
          css = Path('helix-ui/src/styles.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* FRIDAY 0.10 WORKSPACE DOCK */'
          if marker not in css_text:
              css_text += r'''

          /* FRIDAY 0.10 WORKSPACE DOCK */
          .workspace-dock {
            position: relative;
            z-index: 21;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 4px;
            height: 50px;
            padding: 5px 10px;
            border-bottom: 1px solid rgba(54, 128, 255, .22);
            background: linear-gradient(180deg, rgba(2, 8, 19, .96), rgba(1, 5, 13, .88));
            box-shadow: inset 0 -1px rgba(var(--accent-rgb) / .08);
          }
          .workspace-dock button {
            position: relative;
            min-width: 0;
            overflow: hidden;
            border: 1px solid rgba(var(--accent-rgb) / .24);
            background: linear-gradient(180deg, rgba(var(--accent-rgb) / .085), rgba(2, 8, 19, .66));
            color: rgba(219, 236, 255, .76);
            font-family: "Roboto Mono", ui-monospace, monospace;
            line-height: 1.1;
            transition: border-color .18s ease, background .18s ease, transform .18s ease;
          }
          .workspace-dock button::before {
            content: "";
            position: absolute;
            left: 8%; right: 8%; top: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb) / .78), transparent);
          }
          .workspace-dock button:active { transform: scale(.97); background: rgba(var(--accent-rgb) / .17); }
          .workspace-dock button:disabled { opacity: .34; }
          .workspace-dock span {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 6.7px;
            letter-spacing: .09em;
          }
          .workspace-dock small {
            display: block;
            margin-top: 3px;
            font-size: 5.7px;
            letter-spacing: .12em;
            color: rgba(var(--accent-rgb) / .72);
          }
          .ops-main { height: calc(100dvh - 126px); }
          @media (min-width: 720px) {
            .workspace-dock { padding-inline: 16px; gap: 8px; }
            .workspace-dock span { font-size: 8px; }
            .workspace-dock small { font-size: 6.5px; }
          }
          '''
              css.write_text(css_text, encoding='utf-8')

          # Align CI and prove that the feature routes are packaged.
          workflow = Path('.github/workflows/android-apk.yml')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('0.9.31-hardening', '0.10.0-sensory-core')
          text = text.replace('0.9.31', '0.10.0')
          text = text.replace('Hardened', 'Sensory-Core')
          anchor = "          grep -q 'class RuntimeSmokeTest' app/src/androidTest/java/com/seongja/jarvis/RuntimeSmokeTest.kt\n"
          checks = anchor + (
              "          grep -q 'class XCameraActivity' app/src/main/java/com/seongja/jarvis/XCameraActivity.kt\n"
              "          grep -q 'class GeminiVisionClient' app/src/main/java/com/seongja/jarvis/GeminiVisionClient.kt\n"
              "          grep -q 'open your eyes' app/src/main/java/com/seongja/jarvis/FridayVisionRouter.kt\n"
              "          grep -q 'X-CAMERA' helix-ui/src/Hud.tsx\n"
              "          grep -q 'class ImageGenerationActivity' app/src/main/java/com/seongja/jarvis/ImageGenerationActivity.kt\n"
              "          grep -q 'class PrivateDiaryActivity' app/src/main/java/com/seongja/jarvis/PrivateDiaryActivity.kt\n"
          )
          if anchor in text and "class XCameraActivity" not in text:
              text = text.replace(anchor, checks, 1)
          workflow.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo 'Feature recovery wiring already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app helix-ui .github/workflows/android-apk.yml
          git commit -m 'Wire XCamera and native HELIX workspaces'
          git push origin HEAD:agent/complete-hardening-0.9.31
