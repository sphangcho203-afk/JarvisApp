name: Dispatch Tavily Plan Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: friday-tavily-plan-dispatch
  cancel-in-progress: false

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v7
        with:
          ref: agent/friday-0.9.24-tavily-plan-fix
          fetch-depth: 0

      - name: Patch actual source and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected marker missing in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          search_client = Path("app/src/main/java/com/seongja/jarvis/SearchGridResearchClient.kt")
          search_text = search_client.read_text()
          restricted = '                put("safe_search", true)\n'
          if restricted not in search_text:
              raise SystemExit("Enterprise-only Tavily safe_search field was not found")
          search_client.write_text(
              search_text.replace(
                  restricted,
                  '                // safe_search intentionally omitted: standard Tavily plans reject it.\n',
              )
          )

          replace_exact("app/build.gradle.kts", "versionCode = 33", "versionCode = 34")
          replace_exact(
              "app/build.gradle.kts",
              'versionName = "0.9.23-design-lock"',
              'versionName = "0.9.24-tavily-plan-fix"',
          )
          replace_exact("helix-ui/package.json", '"version": "0.9.23"', '"version": "0.9.24"')
          replace_exact("helix-ui/src/Hud.tsx", "BUILD 0.9.23", "BUILD 0.9.24")

          hud_host = Path("app/src/main/java/com/seongja/jarvis/HelixHudView.kt")
          host_text = hud_host.read_text()
          host_text = host_text.replace("FridayHelix/0.9.22", "FridayHelix/0.9.24")
          host_text = host_text.replace("FridayHelix/0.9.23", "FridayHelix/0.9.24")
          hud_host.write_text(host_text)

          workflow = Path(".github/workflows/android-apk.yml")
          workflow_text = workflow.read_text()
          workflow_text = workflow_text.replace("0.9.23-design-lock", "0.9.24-tavily-plan-fix")
          workflow_text = workflow_text.replace("0.9.23-Design-Lock", "0.9.24-Tavily-Plan-Fix")
          workflow_text = workflow_text.replace("0.9.23 // Design Lock", "0.9.24 // Tavily Plan Fix")
          workflow_text = workflow_text.replace("design-lock", "tavily-plan-fix")
          workflow_text = workflow_text.replace("Design-Lock", "Tavily-Plan-Fix")
          workflow_text = workflow_text.replace("Design Lock", "Tavily Plan Fix")
          anchor = "          grep -q 'class NetworkHealthMonitor' app/src/main/java/com/seongja/jarvis/NetworkHealthMonitor.kt\n"
          guard = anchor + (
              "          ! grep -q 'put(\"safe_search\"' app/src/main/java/com/seongja/jarvis/SearchGridResearchClient.kt\n"
              "          grep -q 'standard Tavily plans reject it' app/src/main/java/com/seongja/jarvis/SearchGridResearchClient.kt\n"
          )
          if anchor not in workflow_text:
              raise SystemExit("Android verification anchor missing")
          workflow.write_text(workflow_text.replace(anchor, guard))

          beacon = Path(".github/workflows/ci-status-beacon.yml")
          beacon_text = beacon.read_text()
          beacon_text = beacon_text.replace("0.9.23-design-lock", "0.9.24-tavily-plan-fix")
          beacon_text = beacon_text.replace("0.9.23-Design-Lock", "0.9.24-Tavily-Plan-Fix")
          beacon.write_text(beacon_text)

          Path("ci/friday-0.9.24-tavily-plan-fix.manifest").write_text(
              "F.R.I.D.A.Y. // HELIX OPS\n"
              "VERSION // 0.9.24-tavily-plan-fix\n"
              "VERSION CODE // 34\n"
              "PACKAGE // com.seongja.jarvis\n"
              "PATCH // ENTERPRISE-ONLY TAVILY SAFE_SEARCH OMITTED\n"
              "TAVILY // STANDARD PLAN REQUEST COMPATIBILITY\n"
              "EXA + CORTEX + LOCKED HUD // PRESERVED\n"
          )

          Path(".github/workflows/patch-tavily-plan.yml").unlink(missing_ok=True)
          PY

          git diff --check
          ! grep -R 'put("safe_search"' app/src/main/java/com/seongja/jarvis
          grep -q 'versionName = "0.9.24-tavily-plan-fix"' app/build.gradle.kts
          grep -q 'BUILD 0.9.24' helix-ui/src/Hud.tsx

          git config user.name "FRIDAY Patch Core"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Tavily standard-plan requests"
          git push origin HEAD:agent/friday-0.9.24-tavily-plan-fix

      - name: Remove temporary dispatcher from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B cleanup-main origin/main
          git rm .github/workflows/dispatch-tavily-plan-patch.yml
          git config user.name "FRIDAY Patch Core"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove Tavily patch dispatcher"
          git push origin HEAD:main
