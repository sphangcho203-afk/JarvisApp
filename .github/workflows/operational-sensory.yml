name: Build FRIDAY Operational Sensory Core

on:
  workflow_dispatch:
  push:
    branches:
      - agent/friday-0.14-operational-sensory-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: friday-operational-sensory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and inspect operational FRIDAY
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Apply deterministic FRIDAY integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_provider_integrations.py
          grep -q 'FridayDesignCommandParser' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'setDesignMode' app/src/main/java/com/seongja/jarvis/HelixHudView.kt
          grep -q 'themeShift' app/src/main/java/com/seongja/jarvis/JarvisSoundEngine.kt
          grep -q 'OperationalCore' helix-ui/src/App.tsx

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package-lock.json

      - name: Build operational HELIX interface
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee ../operational-helix-build.log
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html

      - name: Smoke-test phone and desktop scenes
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > operational-helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .5; done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=432,960 --screenshot=operational-mobile.png --dump-dom http://127.0.0.1:4173/ > operational-mobile-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=1280,720 --screenshot=operational-desktop.png http://127.0.0.1:4173/ >/dev/null
          grep -q 'F.R.I.D.A.Y.' operational-mobile-dom.html
          grep -q 'FRIDAY MODULES' operational-mobile-dom.html
          grep -q 'X-CAMERA' operational-mobile-dom.html
          grep -q 'VISUAL LAB' operational-mobile-dom.html
          grep -q 'API PROVIDERS' operational-mobile-dom.html
          grep -q 'VOICE LAB' operational-mobile-dom.html
          grep -q 'PERMISSION CENTER' operational-mobile-dom.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and assemble validation APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all --no-daemon 2>&1 | tee operational-android-build.log

      - name: Verify operational package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt" dump badging "$APK" | tee operational-apk-badging.log
          unzip -l "$APK" | tee operational-apk-contents.log
          grep -q 'assets/helix/index.html' operational-apk-contents.log
          grep -q 'class JarvisSoundEngine' app/src/main/java/com/seongja/jarvis/JarvisSoundEngine.kt
          grep -q 'FridayDesignMode' app/src/main/java/com/seongja/jarvis/FridayDesignMode.kt
          grep -q 'inferOperationalScene' helix-ui/src/OperationalCore.tsx
          mkdir -p validation
          cp "$APK" validation/FRIDAY-0.14-operational-sensory-debug.apk
          sha256sum validation/FRIDAY-0.14-operational-sensory-debug.apk > validation/FRIDAY-0.14-operational-sensory-debug.apk.sha256

      - name: Upload operational validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.14-operational-sensory-validation
          path: |
            validation/
            operational-helix-build.log
            operational-helix-server.log
            operational-mobile-dom.html
            operational-mobile.png
            operational-desktop.png
            operational-android-build.log
            operational-apk-badging.log
            operational-apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Launch operational FRIDAY on Android 16
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android 16 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.14-operational-sensory-android16-runtime
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
