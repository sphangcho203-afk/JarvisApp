name: Build FRIDAY Singularity Core

on:
  workflow_dispatch:
  push:
    branches:
      - agent/friday-0.18-singularity-core
  pull_request:
    branches:
      - agent/friday-0.17-world-map-master
      - main

permissions:
  contents: read

concurrency:
  group: friday-singularity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FRIDAY_VERSION: 0.18.0

jobs:
  build:
    name: Build and inspect FRIDAY singularity core
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Apply deterministic FRIDAY integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_provider_integrations.py
          grep -q "import { SingularityCore }" helix-ui/src/FridayCinematicOS.tsx
          grep -q 'HELIX SINGULARITY' helix-ui/src/SingularityCore.tsx
          grep -q 'sg-armor-plates' helix-ui/src/SingularityCore.tsx
          grep -q 'sg-energy-spine' helix-ui/src/SingularityCore.tsx
          grep -q 'singularityCore.css' helix-ui/src/main.tsx
          grep -q "scene !== 'CORE'" helix-ui/src/FridayCinematicOS.tsx
          if grep -q 'className="fos-menu"' helix-ui/src/FridayCinematicOS.tsx; then
            echo 'Visible navigation menu survived singularity integration' >&2
            exit 1
          fi

      - name: Package world geometry retained from FRIDAY 0.17
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_world_map_assets.py 2>&1 | tee singularity-world-assets.log
          test -s helix-ui/public/geodata/countries-50m.geojson
          test -s helix-ui/public/geodata/places-50m.geojson

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package-lock.json

      - name: Build FRIDAY singularity HELIX
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee ../singularity-helix-build.log
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          test -s app/src/main/assets/helix/geodata/countries-50m.geojson

      - name: Capture idle and live-conversation core
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p validation
          python3 -m http.server 4173 --directory helix-ui/dist > validation/singularity-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .5; done

          capture_scene() {
            local scene="$1"
            local width="$2"
            local height="$3"
            local image="$4"
            local dom="$5"
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --hide-scrollbars --virtual-time-budget=5200 --window-size="$width,$height" --screenshot="$image" --dump-dom "http://127.0.0.1:4173/?scene=$scene" > "$dom"
          }

          capture_scene core 432 960 validation/singularity-idle-phone.png validation/singularity-idle-phone.html
          capture_scene voice 432 960 validation/singularity-listening-phone.png validation/singularity-listening-phone.html
          capture_scene core 1280 720 validation/singularity-idle-desktop.png validation/singularity-idle-desktop.html
          capture_scene voice 1280 720 validation/singularity-listening-desktop.png validation/singularity-listening-desktop.html

          grep -q 'HELIX SINGULARITY' validation/singularity-idle-phone.html
          grep -q 'CORE STABLE' validation/singularity-idle-phone.html
          grep -q 'LIVE CONVERSATION' validation/singularity-idle-phone.html
          grep -q 'Awaiting command.' validation/singularity-idle-phone.html
          grep -q 'VOICE CHANNEL OPEN' validation/singularity-listening-phone.html
          grep -q 'Listening' validation/singularity-listening-phone.html
          grep -q 'sg-plate-top' validation/singularity-idle-phone.html
          grep -q 'sg-stabilizer' validation/singularity-idle-phone.html
          if grep -q 'fos-menu' validation/singularity-idle-phone.html; then
            echo 'Navigation menu rendered on the first interface' >&2
            exit 1
          fi
          if grep -q '<ellipse' validation/singularity-idle-phone.html; then
            echo 'Petal-like ellipse geometry rendered on the first interface' >&2
            exit 1
          fi
          test -s validation/singularity-idle-phone.png
          test -s validation/singularity-listening-phone.png

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and assemble singularity APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all --no-daemon 2>&1 | tee validation/singularity-android-build.log

      - name: Verify APK and certificate
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" validation/FRIDAY-0.18.0-Singularity-Core-debug.apk
          "$TOOLS/zipalign" -c -v 4 validation/FRIDAY-0.18.0-Singularity-Core-debug.apk 2>&1 | tee validation/singularity-apk-zipalign.log
          "$TOOLS/aapt" dump badging validation/FRIDAY-0.18.0-Singularity-Core-debug.apk | tee validation/singularity-apk-badging.log
          "$TOOLS/apksigner" verify --verbose --print-certs validation/FRIDAY-0.18.0-Singularity-Core-debug.apk 2>&1 | tee validation/FRIDAY-0.18.0-debug-certificate.txt
          grep -E 'Signer #1 certificate SHA-1 digest:' validation/FRIDAY-0.18.0-debug-certificate.txt | sed -E 's/^.*digest: *//' | tr '[:lower:]' '[:upper:]' | tee validation/FRIDAY-0.18.0-debug-certificate.sha1
          sha256sum validation/FRIDAY-0.18.0-Singularity-Core-debug.apk | tee validation/FRIDAY-0.18.0-Singularity-Core-debug.apk.sha256
          grep -q "versionCode='46'" validation/singularity-apk-badging.log
          grep -q "versionName='0.18.0-singularity-core-debug'" validation/singularity-apk-badging.log

      - name: Upload singularity APK and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.18.0-singularity-core-validation
          path: |
            validation/
            singularity-world-assets.log
            singularity-helix-build.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Launch FRIDAY singularity core on Android 16
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Apply deterministic FRIDAY integrations
        shell: bash
        run: python3 scripts/apply_provider_integrations.py

      - name: Package world geometry
        shell: bash
        run: python3 scripts/fetch_world_map_assets.py

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package-lock.json

      - name: Build packaged singularity UI
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -netdelay none -netspeed full
          disable-animations: true
          script: |
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android 16 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.18.0-singularity-core-android16
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
