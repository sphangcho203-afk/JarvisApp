name: Apply pre-summon screen context handoff

on:
  push:
    branches:
      - feat/local-device-agent
    paths:
      - tools/patch_screen_context_handoff.py
      - .github/workflows/apply-screen-context-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-device-agent
          fetch-depth: 0

      - name: Apply screen-context handoff
        run: python tools/patch_screen_context_handoff.py

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Capture ephemeral pre-summon screen context"
          git push origin HEAD:feat/local-device-agent
