name: Finalize FRIDAY hardening source

on:
  push:
    branches:
      - agent/complete-hardening-0.9.31

permissions:
  contents: write

concurrency:
  group: friday-finalize-hardening-source
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: agent/complete-hardening-0.9.31
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lock dependencies and align source versions
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/BUILD 0\.9\.[0-9]+/BUILD 0.9.31/g' helix-ui/src/Hud.tsx
          sed -Ei 's#FridayHelix/0\.9\.[0-9]+#FridayHelix/0.9.31#g' app/src/main/java/com/seongja/jarvis/HelixHudView.kt
          if [[ ! -f helix-ui/package-lock.json ]]; then
            cd helix-ui
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            cd ..
          fi
          if git diff --quiet; then
            echo 'Source is already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helix-ui/package-lock.json helix-ui/src/Hud.tsx app/src/main/java/com/seongja/jarvis/HelixHudView.kt
          git commit -m 'Lock HELIX dependencies and align source version'
          git push origin HEAD:agent/complete-hardening-0.9.31
