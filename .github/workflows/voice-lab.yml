name: Build FRIDAY Voice Lab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/friday-0.13-voice-lab
  pull_request:
    branches:
      - main
      - agent/friday-0.12-provider-mesh

permissions:
  contents: read

concurrency:
  group: friday-voice-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and inspect Voice Lab
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Apply deterministic FRIDAY integrations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize_sensory_source.py
          python3 scripts/run_pending_integrations.py
          python3 scripts/apply_provider_integrations.py
          grep -q 'FridayVoiceLabCommand.matches' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'refreshVoiceProfile' app/src/main/java/com/seongja/jarvis/VoiceLoop.kt
          grep -q 'class FridayVoiceLabActivity' app/src/main/java/com/seongja/jarvis/FridayVoiceLabActivity.kt
          grep -q 'FridayVoiceLabActivity' app/src/main/AndroidManifest.xml
          grep -q 'VOICE LAB' helix-ui/src/WorkspaceRail.tsx

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package-lock.json

      - name: Build HELIX workspace
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and assemble Voice Lab
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all --no-daemon 2>&1 | tee voice-lab-build.log

      - name: Verify Voice Lab package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee voice-lab-apk.log
          unzip -l "$APK" | tee voice-lab-contents.log
          grep -q 'class FridayVoiceLabActivity' app/src/main/java/com/seongja/jarvis/FridayVoiceLabActivity.kt
          grep -q 'class LocalJarvisVoice' app/src/main/java/com/seongja/jarvis/LocalJarvisVoice.kt
          grep -q 'android.intent.action.TTS_SERVICE' app/src/main/AndroidManifest.xml

      - name: Upload Voice Lab validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.13.0-voice-lab-validation
          path: |
            voice-lab-build.log
            voice-lab-apk.log
            voice-lab-contents.log
            app/build/outputs/apk/debug/
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Launch Voice Lab build on Android 16
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android 16 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.13.0-voice-lab-android16-runtime
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
