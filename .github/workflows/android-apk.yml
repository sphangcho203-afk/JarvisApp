name: Build FRIDAY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: friday-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate FRIDAY Gmail Recovery APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package.json

      - name: Build locked HELIX interface
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/BUILD 0.9.25/BUILD 0.9.27/g; s/BUILD 0.9.26/BUILD 0.9.27/g' helix-ui/src/Hud.tsx
          cd helix-ui
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee ../helix-build.log
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          test -n "$(find app/src/main/assets/helix/assets -name '*.js' -type f -print -quit)"
          test -n "$(find app/src/main/assets/helix/assets -name '*.css' -type f -print -quit)"

      - name: Smoke-test phone and desktop HUD
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 0.5
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=432,960 --screenshot=helix-mobile-smoke.png --dump-dom http://127.0.0.1:4173/ > helix-mobile-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=1280,720 --screenshot=helix-desktop-smoke.png http://127.0.0.1:4173/ > /dev/null
          grep -q 'F.R.I.D.A.Y.' helix-mobile-dom.html
          grep -q 'HELIX OPS' helix-mobile-dom.html
          grep -q 'BUILD 0.9.27' helix-mobile-dom.html
          grep -q 'RESPONSE TERMINAL' helix-mobile-dom.html
          grep -q 'response-scroll' helix-mobile-dom.html
          grep -q 'weather-glyph' helix-mobile-dom.html
          if grep -Eq '[⚠☂❄☁☼⛈]' helix-ui/src/Hud.tsx; then exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2

      - name: Lint, test, and build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-build.log

      - name: Verify Gmail recovery, icon, and preserved systems
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee apk-signature.log
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" 2>&1 | tee apk-zipalign.log
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.log
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.log
          unzip -l "$APK" | tee apk-contents.log
          grep -q "package: name='com.seongja.jarvis'" apk-badging.log
          grep -q "versionName='0.9.27-gmail-recovery'" apk-badging.log
          grep -q "application-label:'F.R.I.D.A.Y.'" apk-badging.log
          grep -q 'classes.dex' apk-contents.log
          grep -q 'assets/helix/index.html' apk-contents.log
          grep -q 'object GmailAuthorizationRecovery' app/src/main/java/com/seongja/jarvis/GmailAuthorizationRecovery.kt
          grep -q 'TOKEN GRANTED // RESOLVING MAILBOX' app/src/main/java/com/seongja/jarvis/GmailAuthorizationActivity.kt
          grep -q 'val storedAccount = authStore.load().accountEmail' app/src/main/java/com/seongja/jarvis/GmailApiClient.kt
          grep -q 'profileWithToken(token)' app/src/main/java/com/seongja/jarvis/GmailApiClient.kt
          grep -q 'M35,30 L70,30' app/src/main/res/drawable/ic_launcher_background.xml
          grep -q 'class WaApiClient' app/src/main/java/com/seongja/jarvis/WaApiClient.kt
          grep -q 'class GeminiImageClient' app/src/main/java/com/seongja/jarvis/GeminiImageClient.kt
          grep -q 'response-scroll' helix-ui/src/Hud.tsx
          mkdir -p release
          cp "$APK" release/FRIDAY-0.9.27-Gmail-Recovery.apk
          sha256sum release/FRIDAY-0.9.27-Gmail-Recovery.apk > release/FRIDAY-0.9.27-Gmail-Recovery.apk.sha256

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.9.27-gmail-recovery-validation-logs
          path: |
            helix-build.log
            helix-server.log
            helix-mobile-dom.html
            helix-mobile-smoke.png
            helix-desktop-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-Helix-0.9.27-Gmail-Recovery-apk
          path: |
            release/FRIDAY-0.9.27-Gmail-Recovery.apk
            release/FRIDAY-0.9.27-Gmail-Recovery.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable FRIDAY release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.9.27-gmail-recovery"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag --yes; fi
          gh release create "$TAG" release/FRIDAY-0.9.27-Gmail-Recovery.apk release/FRIDAY-0.9.27-Gmail-Recovery.apk.sha256 --target "$GITHUB_SHA" --title "F.R.I.D.A.Y. 0.9.27 // Gmail Recovery" --notes "Repairs already-granted Gmail authorization by resolving the mailbox identity through the Gmail profile endpoint, reusing the persisted account during token refresh, and introduces a new HELIX launcher emblem while preserving WaAPI, image synthesis, voice polish, and the locked HUD."
