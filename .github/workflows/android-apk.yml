name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate private Jarvis voice APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply private Jarvis native patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/private-jarvis-voice-and-personality'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_private_jarvis.py

          if ! git diff --quiet; then
            git config user.name 'Jarvis Repair Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add \
              app/src/main/java/com/seongja/jarvis/VoiceLoop.kt \
              app/src/main/java/com/seongja/jarvis/MainActivity.kt \
              app/src/main/java/com/seongja/jarvis/JarvisBrain.kt \
              app/src/main/java/com/seongja/jarvis/SearchGridResearchClient.kt \
              app/src/main/java/com/seongja/jarvis/HelixHudView.kt
            git commit -m 'Restore private Jarvis identity and local voice output'
            git push origin HEAD:fix/private-jarvis-voice-and-personality
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package.json

      - name: Build voice-first Helix interface
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee ../helix-build.log
          cd ..

          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          test -n "$(find app/src/main/assets/helix/assets -name '*.js' -type f -print -quit)"
          test -n "$(find app/src/main/assets/helix/assets -name '*.css' -type f -print -quit)"

      - name: Smoke-test private Jarvis HUD
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 0.5
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=1280,720 --screenshot=helix-smoke.png --dump-dom http://127.0.0.1:4173/ > helix-dom.html
          grep -q 'SEONGJA PRIVATE INTELLIGENCE' helix-dom.html
          grep -q 'BUILD 0.9.17' helix-dom.html
          grep -q 'API SETUP' helix-dom.html
          grep -q 'NO CHAT INPUT LAYER' helix-dom.html
          if grep -q 'TYPE COMMAND' helix-dom.html || grep -q '>SEND<' helix-dom.html; then
            echo 'Chat input controls are still present.' >&2
            exit 1
          fi
          if grep -q 'RENDER FALLBACK ONLINE' helix-dom.html; then
            echo 'Helix entered the render fallback.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2

      - name: Lint, test, and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-build.log

      - name: Verify private Jarvis APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee apk-signature.log
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" 2>&1 | tee apk-zipalign.log
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.log
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.log
          unzip -l "$APK" | tee apk-contents.log

          grep -q "versionName='0.9.17-private-voice'" apk-badging.log
          grep -q "android.permission.RECORD_AUDIO" apk-permissions.log
          grep -q 'classes.dex' apk-contents.log
          grep -q 'assets/helix/index.html' apk-contents.log
          grep -q 'private lateinit var localVoice' app/src/main/java/com/seongja/jarvis/VoiceLoop.kt
          grep -q 'LOCAL JARVIS SYNTHESIS' app/src/main/java/com/seongja/jarvis/VoiceLoop.kt
          grep -q 'HIDDEN_XML_BLOCK' app/src/main/java/com/seongja/jarvis/JarvisResponseSanitizer.kt
          grep -q 'OWNER-CORE 1.3' app/src/main/java/com/seongja/jarvis/OwnerIdentityCore.kt
          grep -q 'I am Jarvis, your private personal intelligence' app/src/main/java/com/seongja/jarvis/JarvisBrain.kt
          grep -q 'groundedResearch = true' app/src/main/java/com/seongja/jarvis/SearchGridResearchClient.kt

          rm -rf apk-helix-check
          mkdir -p apk-helix-check
          unzip -q "$APK" 'assets/helix/*' -d apk-helix-check
          grep -R -q 'SEONGJA PRIVATE INTELLIGENCE' apk-helix-check/assets/helix/assets
          if grep -R -q 'TYPE COMMAND' apk-helix-check/assets/helix/assets; then
            echo 'Text chat UI leaked into the APK.' >&2
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-0.9.17-validation-logs
          path: |
            helix-build.log
            helix-server.log
            helix-dom.html
            helix-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Helix-0.9.17-private-voice-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
