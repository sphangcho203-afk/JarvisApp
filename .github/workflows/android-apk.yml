name: Build FRIDAY Sensory Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/complete-hardening-0.9.31
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: friday-sensory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FRIDAY_VERSION: 0.10.0

jobs:
  finalize-source:
    name: Finalize native feature routing
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/complete-hardening-0.9.31'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/complete-hardening-0.9.31
          fetch-depth: 0

      - name: Wire XCamera, workspace dock, and visual commands
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Anchor missing in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_line(path: str, needle: str, replacement: str) -> None:
              file = Path(path)
              lines = file.read_text(encoding='utf-8').splitlines()
              if any(line == replacement for line in lines):
                  return
              for index, line in enumerate(lines):
                  if needle in line:
                      lines[index] = replacement
                      file.write_text('\n'.join(lines) + '\n', encoding='utf-8')
                      return
              raise SystemExit(f'Line containing {needle!r} missing in {path}')

          # Deterministic vision routing before generic model dialogue.
          replace_once(
              'app/src/main/java/com/seongja/jarvis/JarvisBrain.kt',
              '    private val capabilityRouter = FridayCapabilityRouter(appContext)\n',
              '    private val visionRouter = FridayVisionRouter(appContext)\n'
              '    private val capabilityRouter = FridayCapabilityRouter(appContext)\n'
          )
          replace_once(
              'app/src/main/java/com/seongja/jarvis/JarvisBrain.kt',
              '        capabilityRouter.intercept(input, memory.summary(), onCortexToken)?.let { return it }\n',
              '        visionRouter.intercept(input, memory.summary(), onCortexToken)?.let { return it }\n'
              '        capabilityRouter.intercept(input, memory.summary(), onCortexToken)?.let { return it }\n'
          )
          brain = Path('app/src/main/java/com/seongja/jarvis/JarvisBrain.kt')
          brain.write_text(
              brain.read_text(encoding='utf-8').replace(
                  'OPERATIONS CORE // 0.9.24',
                  'OPERATIONS CORE // 0.10.0 // SENSORY CORE'
              ),
              encoding='utf-8'
          )

          # MainActivity owns real workspace launches and receives visual results.
          replace_once(
              'app/src/main/java/com/seongja/jarvis/MainActivity.kt',
              '        hud.isLongClickable = false\n',
              '        hud.setWorkspaceListener(::openWorkspace)\n'
              '        hud.isLongClickable = false\n'
          )
          replace_once(
              'app/src/main/java/com/seongja/jarvis/MainActivity.kt',
              '        WeatherRuntime.refresh()\n        if (hasMicPermission() && !brainBusy.get()) {\n',
              '        WeatherRuntime.refresh()\n'
              '        consumeXCameraResult()\n'
              '        if (hasMicPermission() && !brainBusy.get()) {\n'
          )
          replace_once(
              'app/src/main/java/com/seongja/jarvis/MainActivity.kt',
              '    private fun handlePartialSpeech(text: String) {\n',
              '''    private fun openWorkspace(workspace: String) {
                  when (workspace.trim().lowercase(Locale.US)) {
                      "xcamera", "vision", "eyes" -> XCameraActivity.launch(this, autoScan = false)
                      "image", "visual", "studio" -> ImageGenerationActivity.launch(this, "")
                      "diary" -> PrivateDiaryActivity.launch(this)
                      "memory", "vault" -> MemoryVaultActivity.launch(this)
                      "control", "permissions" -> startActivity(Intent(this, PermissionCenterActivity::class.java))
                      "apis", "cortex" -> startActivity(Intent(this, CloudConfigActivity::class.java))
                      else -> hud.pushEvent("WORKSPACE -> UNKNOWN ${workspace.take(32).uppercase(Locale.US)}")
                  }
              }

              private fun consumeXCameraResult() {
                  val result = XCameraRuntime.consume() ?: return
                  val response = BrainResponse(
                      spoken = result.description,
                      display = buildString {
                          appendLine(if (result.isError) "X-CAMERA // DEGRADED" else "X-CAMERA // VISUAL ANALYSIS VERIFIED")
                          appendLine("QUESTION // ${result.question.take(320)}")
                          appendLine("MODEL // ${result.model}")
                          appendLine("TIME // ${result.elapsedMs}MS")
                          append(result.description)
                      },
                      intent = if (result.isError) "vision/error" else "vision/result",
                      confidence = if (result.isError) 0f else .97f,
                      mode = if (result.isError) BrainMode.ALERT else BrainMode.ONLINE,
                      trace = listOf(
                          "workspace=x_camera",
                          "model=${result.model}",
                          "latency=${result.elapsedMs}ms",
                          "capture_persistence=disabled"
                      ),
                      memory = brain.memorySnapshot(),
                      thoughts = listOf("A temporary camera frame was analyzed and discarded."),
                      entities = listOf("sensor=xcamera"),
                      decision = if (result.isError) "report_xcamera_error" else "return_visual_analysis",
                      action = BrainAction()
                  )
                  hud.submitBrainResponse(response)
                  hud.pushEvent(if (result.isError) "X-CAMERA -> DEGRADED" else "X-CAMERA -> RESULT VERIFIED")
                  if (!result.isError) mainHandler.postDelayed({ if (resumed) speak(result.description) }, 280L)
              }

              private fun handlePartialSpeech(text: String) {
              '''
          )

          # Native WebView bridge for operational workspace controls.
          replace_once(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '    private var coreTapListener: (() -> Unit)? = null\n',
              '    private var coreTapListener: (() -> Unit)? = null\n'
              '    private var workspaceListener: ((String) -> Unit)? = null\n'
          )
          replace_once(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '    fun setCoreTapListener(listener: () -> Unit) {\n        coreTapListener = listener\n    }\n',
              '    fun setCoreTapListener(listener: () -> Unit) {\n'
              '        coreTapListener = listener\n'
              '    }\n\n'
              '    fun setWorkspaceListener(listener: (String) -> Unit) {\n'
              '        workspaceListener = listener\n'
              '    }\n'
          )
          replace_once(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '        coreTapListener = null\n',
              '        coreTapListener = null\n        workspaceListener = null\n'
          )
          replace_once(
              'app/src/main/java/com/seongja/jarvis/HelixHudView.kt',
              '''        @JavascriptInterface
                      fun onCoreTap() {
                          post {
                              if (!released) {
                                  performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                                  coreTapListener?.invoke()
                              }
                          }
                      }
                  }
              ''',
              '''        @JavascriptInterface
                      fun onCoreTap() {
                          post {
                              if (!released) {
                                  performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                                  coreTapListener?.invoke()
                              }
                          }
                      }

                      @JavascriptInterface
                      fun openWorkspace(workspace: String) {
                          val clean = workspace.replace(Regex("[^A-Za-z0-9_-]"), "").take(32)
                          if (clean.isBlank()) return
                          post {
                              if (!released) {
                                  performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                                  dispatchEvent("WORKSPACE -> ${clean.uppercase(Locale.US)}", "SYS")
                                  workspaceListener?.invoke(clean)
                              }
                          }
                      }
                  }
              '''
          )
          hud_native = Path('app/src/main/java/com/seongja/jarvis/HelixHudView.kt')
          hud_native.write_text(
              hud_native.read_text(encoding='utf-8').replace('FridayHelix/0.9.31', 'FridayHelix/0.10.0'),
              encoding='utf-8'
          )

          # React/native bridge.
          replace_once(
              'helix-ui/src/nativeBridge.ts',
              '      onCoreTap: () => void\n      onHelixError?: (message: string) => void\n',
              '      onCoreTap: () => void\n'
              '      openWorkspace: (workspace: string) => void\n'
              '      onHelixError?: (message: string) => void\n'
          )
          replace_once(
              'helix-ui/src/nativeBridge.ts',
              '    tapCore: () => window.JarvisAndroid?.onCoreTap(),\n',
              '    tapCore: () => window.JarvisAndroid?.onCoreTap(),\n'
              '    openWorkspace: (workspace: string) => window.JarvisAndroid?.openWorkspace?.(workspace),\n'
          )
          replace_once(
              'helix-ui/src/App.tsx',
              '        onCoreTap={bridge.tapCore}\n',
              '        onCoreTap={bridge.tapCore}\n'
              '        onOpenWorkspace={bridge.openWorkspace}\n'
          )
          replace_once(
              'helix-ui/src/Hud.tsx',
              '  onCoreTap: () => void\n',
              '  onCoreTap: () => void\n  onOpenWorkspace: (workspace: string) => void\n'
          )
          replace_once(
              'helix-ui/src/Hud.tsx',
              '      <Header mode={props.mode} theme={theme} telemetry={props.telemetry} bridgeReady={props.bridgeReady} />\n      <main className="ops-main">\n',
              '      <Header mode={props.mode} theme={theme} telemetry={props.telemetry} bridgeReady={props.bridgeReady} />\n'
              '      <WorkspaceDock onOpen={props.onOpenWorkspace} bridgeReady={props.bridgeReady} />\n'
              '      <main className="ops-main">\n'
          )
          replace_once(
              'helix-ui/src/Hud.tsx',
              'function Header({\n',
              '''function WorkspaceDock({ onOpen, bridgeReady }: { onOpen: (workspace: string) => void; bridgeReady: boolean }) {
                  const workspaces = [
                      ['xcamera', 'X-CAMERA', 'VISION'],
                      ['image', 'VISUAL LAB', 'CREATE'],
                      ['diary', 'PRIVATE DIARY', 'WRITE'],
                      ['memory', 'MEMORY VAULT', 'RECALL'],
                      ['control', 'CONTROL', 'ANDROID'],
                  ]
                  return (
                      <nav className="workspace-dock" aria-label="FRIDAY operational workspaces">
                          {workspaces.map(([id, label, meta]) => (
                              <button key={id} type="button" disabled={!bridgeReady} onClick={() => onOpen(id)}>
                                  <span>{label}</span><small>{meta}</small>
                              </button>
                          ))}
                      </nav>
                  )
              }

              function Header({
              '''
          )
          helix_hud = Path('helix-ui/src/Hud.tsx')
          helix_hud.write_text(
              helix_hud.read_text(encoding='utf-8').replace('BUILD 0.9.31', 'BUILD 0.10.0'),
              encoding='utf-8'
          )

          # Catch 3D model and visualization phrases before cloud chat.
          replace_line(
              'app/src/main/java/com/seongja/jarvis/FridayCapabilityRouter.kt',
              'private val creationVerb',
              '    private val creationVerb = Regex("\\b(create|generate|make|draw|design|render|produce|illustrate|paint|visuali[sz]e|model|show)\\b", RegexOption.IGNORE_CASE)'
          )
          replace_line(
              'app/src/main/java/com/seongja/jarvis/FridayCapabilityRouter.kt',
              'private val visualNoun',
              '    private val visualNoun = Regex("\\b(image|picture|photo|wallpaper|poster|logo|art|artwork|illustration|graphic|thumbnail|cover|visual|scene|concept|diagram|3d\\s+model|model)\\b", RegexOption.IGNORE_CASE)'
          )
          capability = Path('app/src/main/java/com/seongja/jarvis/FridayCapabilityRouter.kt')
          capability_text = capability.read_text(encoding='utf-8')
          capability_text = capability_text.replace(
              '(create|generate|make|draw|design|render|produce|illustrate|paint)\\s+',
              '(create|generate|make|draw|design|render|produce|illustrate|paint|visualize|visualise|model|show me)\\s+'
          )
          capability_text = capability_text.replace(
              '(image|picture|photo|wallpaper|poster|logo|artwork?|illustration|graphic|thumbnail|cover)\\s+',
              '(image|picture|photo|wallpaper|poster|logo|artwork?|illustration|graphic|thumbnail|cover|visual|scene|concept|diagram|3d\\s+model|model)\\s+'
          )
          capability.write_text(capability_text, encoding='utf-8')

          # Visible operational dock styling.
          css = Path('helix-ui/src/styles.css')
          css_text = css.read_text(encoding='utf-8')
          if '/* FRIDAY 0.10 WORKSPACE DOCK */' not in css_text:
              css_text += r'''

          /* FRIDAY 0.10 WORKSPACE DOCK */
          .workspace-dock {
            position: relative; z-index: 21; display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
            height: 50px; padding: 5px 10px;
            border-bottom: 1px solid rgba(54, 128, 255, .22);
            background: linear-gradient(180deg, rgba(2, 8, 19, .96), rgba(1, 5, 13, .88));
          }
          .workspace-dock button {
            position: relative; min-width: 0; overflow: hidden;
            border: 1px solid rgba(var(--accent-rgb) / .24);
            background: linear-gradient(180deg, rgba(var(--accent-rgb) / .085), rgba(2, 8, 19, .66));
            color: rgba(219, 236, 255, .76);
            font-family: "Roboto Mono", ui-monospace, monospace;
            line-height: 1.1; transition: .18s ease;
          }
          .workspace-dock button::before {
            content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb) / .78), transparent);
          }
          .workspace-dock button:active { transform: scale(.97); background: rgba(var(--accent-rgb) / .17); }
          .workspace-dock button:disabled { opacity: .34; }
          .workspace-dock span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 6.7px; letter-spacing: .09em; }
          .workspace-dock small { display: block; margin-top: 3px; font-size: 5.7px; letter-spacing: .12em; color: rgba(var(--accent-rgb) / .72); }
          .ops-main { height: calc(100dvh - 126px); }
          @media (min-width: 720px) {
            .workspace-dock { padding-inline: 16px; gap: 8px; }
            .workspace-dock span { font-size: 8px; }
            .workspace-dock small { font-size: 6.5px; }
          }
          '''
              css.write_text(css_text, encoding='utf-8')

          # Align locked package metadata.
          for path in ('helix-ui/package.json', 'helix-ui/package-lock.json'):
              file = Path(path)
              file.write_text(file.read_text(encoding='utf-8').replace('"version": "0.9.31"', '"version": "0.10.0"'), encoding='utf-8')

          # Retire the untrusted helper once this trusted workflow performs its work.
          Path('.github/workflows/feature-recovery-finalizer.yml').unlink(missing_ok=True)
          PY

          if git diff --quiet; then
            echo 'Source already finalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app helix-ui .github/workflows/feature-recovery-finalizer.yml
          git commit -m 'Wire XCamera and native HELIX workspaces'
          git push origin HEAD:agent/complete-hardening-0.9.31

  build:
    name: Build and inspect FRIDAY 0.10.0
    needs: finalize-source
    if: always() && (needs.finalize-source.result == 'success' || needs.finalize-source.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      signed: ${{ steps.verify.outputs.signed }}
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package-lock.json

      - name: Build locked HELIX interface
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee ../helix-build.log
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          grep -q 'X-CAMERA' helix-ui/src/Hud.tsx
          grep -q 'BUILD 0.10.0' helix-ui/src/Hud.tsx

      - name: Smoke-test phone and desktop HELIX
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .5; done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=432,960 --screenshot=helix-mobile-smoke.png --dump-dom http://127.0.0.1:4173/ > helix-mobile-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=1280,720 --screenshot=helix-desktop-smoke.png http://127.0.0.1:4173/ >/dev/null
          grep -q 'F.R.I.D.A.Y.' helix-mobile-dom.html
          grep -q 'X-CAMERA' helix-mobile-dom.html
          grep -q 'VISUAL LAB' helix-mobile-dom.html
          grep -q 'PRIVATE DIARY' helix-mobile-dom.html
          grep -q 'MEMORY VAULT' helix-mobile-dom.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare permanent signing material
        id: signing
        shell: bash
        env:
          FRIDAY_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
          FRIDAY_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.FRIDAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$FRIDAY_KEYSTORE_BASE64" && -n "$FRIDAY_KEYSTORE_PASSWORD" && -n "$FRIDAY_KEY_ALIAS" && -n "$FRIDAY_KEY_PASSWORD" ]]; then
            mkdir -p .signing
            printf '%s' "$FRIDAY_KEYSTORE_BASE64" | base64 --decode > .signing/friday-release.jks
            chmod 600 .signing/friday-release.jks
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, test, and assemble both variants
        shell: bash
        env:
          FRIDAY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/friday-release.jks
          FRIDAY_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.FRIDAY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-build.log

      - name: Verify native sensory package
        id: verify
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$RELEASE_APK"
          "$TOOLS/zipalign" -c -v 4 "$RELEASE_APK" 2>&1 | tee apk-zipalign.log
          "$TOOLS/aapt" dump badging "$RELEASE_APK" | tee apk-badging.log
          "$TOOLS/aapt" dump permissions "$RELEASE_APK" | tee apk-permissions.log
          unzip -l "$RELEASE_APK" | tee apk-contents.log
          grep -q "versionName='0.10.0-sensory-core'" apk-badging.log
          grep -q "application-label:'F.R.I.D.A.Y.'" apk-badging.log
          ! grep -q 'application-debuggable' apk-badging.log
          grep -q 'android.permission.CAMERA' apk-permissions.log
          grep -q 'assets/helix/index.html' apk-contents.log
          grep -q 'class XCameraActivity' app/src/main/java/com/seongja/jarvis/XCameraActivity.kt
          grep -q 'class GeminiVisionClient' app/src/main/java/com/seongja/jarvis/GeminiVisionClient.kt
          grep -q 'open your eyes' app/src/main/java/com/seongja/jarvis/FridayVisionRouter.kt
          grep -q 'class ImageGenerationActivity' app/src/main/java/com/seongja/jarvis/ImageGenerationActivity.kt
          grep -q 'class PrivateDiaryActivity' app/src/main/java/com/seongja/jarvis/PrivateDiaryActivity.kt
          mkdir -p release
          if [[ "$SIGNING_CONFIGURED" == 'true' ]]; then
            "$TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK" 2>&1 | tee apk-signature.log
            cp "$RELEASE_APK" release/FRIDAY-0.10.0-Sensory-Core.apk
            sha256sum release/FRIDAY-0.10.0-Sensory-Core.apk > release/FRIDAY-0.10.0-Sensory-Core.apk.sha256
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            if "$TOOLS/apksigner" verify "$RELEASE_APK" > apk-signature.log 2>&1; then
              echo 'Unsigned validation build unexpectedly has a certificate.' >&2
              exit 1
            fi
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.10.0-sensory-validation
          path: |
            helix-build.log
            helix-server.log
            helix-mobile-dom.html
            helix-mobile-smoke.png
            helix-desktop-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed APK
        if: success() && steps.verify.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.10.0-signed-apk
          path: release/
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Launch FRIDAY on Android 16
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 16 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.10.0-android16-runtime
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
