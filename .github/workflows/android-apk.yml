name: Build FRIDAY APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: friday-capability-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    name: Integrate Gmail OAuth and image intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout capability branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore production factory and apply source integration
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml
          python3 ci/apply_0_9_24_capability_patch.py

          git config user.name "FRIDAY Capability Core"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Gmail OAuth and Gemini image intelligence"
          git push origin "HEAD:${HEAD_BRANCH}"
