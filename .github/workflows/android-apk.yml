name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: jarvis-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and assemble Helix debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Add no-voice API setup escape hatch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/voice-fault-recovery'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/seongja/jarvis/MainActivity.kt')
          source = main.read_text(encoding='utf-8')
          old = '''        hud.setCoreTapListener {
              when {
                  brainBusy.get() -> abortActiveRequest("USER CANCELLED ACTIVE REQUEST")
                  hasMicPermission() -> {
                      hud.pushEvent("USER -> VOICE ARRAY RECALIBRATION")
                      voiceLoop.manualRestart()
                  }
                  else -> {
                      hud.pushEvent("AUTH -> REQUESTING MICROPHONE")
                      requestMicPermission()
                  }
              }
          }
          '''
          new = '''        hud.setCoreTapListener {
              when {
                  brainBusy.get() -> abortActiveRequest("USER CANCELLED ACTIVE REQUEST")
                  !brain.isCloudConfigured() -> {
                      hud.pushEvent("CORTEX MESH CONFIG -> OPEN // CORE TAP")
                      voiceLoop.stop()
                      startActivity(Intent(this, CloudConfigActivity::class.java))
                  }
                  hasMicPermission() -> {
                      hud.pushEvent("USER -> VOICE ARRAY RECALIBRATION")
                      voiceLoop.manualRestart()
                  }
                  else -> {
                      hud.pushEvent("AUTH -> REQUESTING MICROPHONE")
                      requestMicPermission()
                  }
              }
          }
          '''
          if old in source:
              source = source.replace(old, new, 1)
              main.write_text(source, encoding='utf-8')
          elif 'CORTEX MESH CONFIG -> OPEN // CORE TAP' not in source:
              raise SystemExit('Core tap listener block was not found')

          hud = Path('helix-ui/src/Hud.tsx')
          hud_source = hud.read_text(encoding='utf-8')
          hud_source = hud_source.replace('BUILD 0.9.13', 'BUILD 0.9.14')
          hud_source = hud_source.replace(
              '>TAP CORE // RECALIBRATE</span>',
              ">{telemetry.cloudConfigured ? 'TAP CORE // RECALIBRATE' : 'TAP CORE // API SETUP'}</span>",
          )
          hud.write_text(hud_source, encoding='utf-8')

          package = Path('helix-ui/package.json')
          package_source = package.read_text(encoding='utf-8').replace(
              '"version": "0.9.13"',
              '"version": "0.9.14"',
          )
          package.write_text(package_source, encoding='utf-8')
          PY

          grep -q 'CORTEX MESH CONFIG -> OPEN // CORE TAP' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'BUILD 0.9.14' helix-ui/src/Hud.tsx
          grep -q 'TAP CORE // API SETUP' helix-ui/src/Hud.tsx

          if ! git diff --quiet; then
            git config user.name 'Jarvis Repair Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add app/src/main/java/com/seongja/jarvis/MainActivity.kt helix-ui/src/Hud.tsx helix-ui/package.json
            git commit -m 'Add core-tap API setup escape hatch'
            git push origin HEAD:fix/voice-fault-recovery
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package.json

      - name: Build Helix React WebGL interface
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee ../helix-build.log
          cd ..

          node --input-type=commonjs <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const root = path.resolve('helix-ui/dist')
          const htmlPath = path.join(root, 'index.html')
          const html = fs.readFileSync(htmlPath, 'utf8')
          const references = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map(match => match[1])
            .filter(value => value.startsWith('./') || value.startsWith('assets/'))
          const files = references.map(value => value.replace(/^\.\//, '').split(/[?#]/)[0])
          if (!files.some(value => value.endsWith('.js'))) throw new Error('Built index has no JavaScript bundle')
          if (!files.some(value => value.endsWith('.css'))) throw new Error('Built index has no CSS bundle')
          for (const file of files) {
            const resolved = path.resolve(root, file)
            if (!resolved.startsWith(root + path.sep) || !fs.existsSync(resolved) || fs.statSync(resolved).size === 0) {
              throw new Error(`Missing or empty built asset: ${file}`)
            }
          }
          console.log(`Verified ${files.length} Helix asset references`)
          NODE

          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          test -n "$(find app/src/main/assets/helix/assets -name '*.js' -type f -print -quit)"
          test -n "$(find app/src/main/assets/helix/assets -name '*.css' -type f -print -quit)"

      - name: Smoke-test Helix runtime in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          test "$READY" = 1

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=swiftshader \
            --enable-webgl \
            --virtual-time-budget=7000 \
            --window-size=1280,720 \
            --screenshot=helix-smoke.png \
            --dump-dom \
            http://127.0.0.1:4173/ > helix-dom.html

          grep -q 'JARVIS // HELIX' helix-dom.html
          grep -q 'WEBGL CORE // ORION HELIX' helix-dom.html
          if grep -q 'RENDER FALLBACK ONLINE' helix-dom.html; then
            echo 'Helix entered the WebGL fallback during the browser smoke test.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2

      - name: Lint, test, and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace \
            --warning-mode all \
            --no-daemon 2>&1 | tee android-build.log

      - name: Verify APK package, signature, alignment, permissions, and Helix assets
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee apk-signature.log
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" 2>&1 | tee apk-zipalign.log
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.log
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.log
          unzip -l "$APK" | tee apk-contents.log

          grep -q "package: name='com.seongja.jarvis'" apk-badging.log
          grep -q "versionName='0.9.14-voice-recovery'" apk-badging.log
          grep -q "sdkVersion:'28'" apk-badging.log
          grep -q "targetSdkVersion:'35'" apk-badging.log
          grep -q "android.permission.RECORD_AUDIO" apk-permissions.log
          grep -q "android.permission.FOREGROUND_SERVICE_MICROPHONE" apk-permissions.log
          grep -q 'classes.dex' apk-contents.log
          grep -q 'assets/helix/index.html' apk-contents.log
          grep -q 'assets/helix/assets/.*\.js' apk-contents.log
          grep -q 'assets/helix/assets/.*\.css' apk-contents.log

          rm -rf apk-helix-check
          mkdir -p apk-helix-check
          unzip -q "$APK" 'assets/helix/*' -d apk-helix-check

          node --input-type=commonjs <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const root = path.resolve('apk-helix-check/assets/helix')
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8')
          const references = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map(match => match[1])
            .filter(value => value.startsWith('./') || value.startsWith('assets/'))
          for (const reference of references) {
            const file = reference.replace(/^\.\//, '').split(/[?#]/)[0]
            const resolved = path.resolve(root, file)
            if (!resolved.startsWith(root + path.sep) || !fs.existsSync(resolved) || fs.statSync(resolved).size === 0) {
              throw new Error(`APK contains a broken Helix reference: ${file}`)
            }
          }
          console.log(`Verified ${references.length} Helix references inside the APK`)
          NODE

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Helix-validation-logs
          path: |
            helix-build.log
            helix-server.log
            helix-dom.html
            helix-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Helix-voice-recovery-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
