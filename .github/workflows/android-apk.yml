name: Build FRIDAY APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: friday-hud-voice-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    name: Integrate custom HUD glyphs and natural speech
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout polish branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore factory and apply production patch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/android-apk.yml > .github/workflows/android-apk.yml
          python3 ci/apply_0_9_25_hud_voice_patch.py

          git config user.name "FRIDAY Interface Core"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Integrate custom HUD glyphs and natural speech"
          git push origin "HEAD:${HEAD_BRANCH}"
