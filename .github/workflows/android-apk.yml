name: Build FRIDAY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: friday-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FRIDAY_VERSION: 0.9.31

jobs:
  build:
    name: Build and inspect FRIDAY 0.9.31
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.verify.outputs.signed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install and build locked HELIX interface
        shell: bash
        run: |
          set -euo pipefail
          sed -Ei 's/BUILD 0\.9\.[0-9]+/BUILD 0.9.31/g' helix-ui/src/Hud.tsx
          sed -Ei 's#FridayHelix/0\.9\.[0-9]+#FridayHelix/0.9.31#g' app/src/main/java/com/seongja/jarvis/HelixHudView.kt
          cd helix-ui
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
            cp package-lock.json ../generated-package-lock.json
          fi
          npm run build 2>&1 | tee ../helix-build.log
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          test -n "$(find app/src/main/assets/helix/assets -name '*.js' -type f -print -quit)"
          test -n "$(find app/src/main/assets/helix/assets -name '*.css' -type f -print -quit)"

      - name: Upload generated dependency lock candidate
        if: hashFiles('generated-package-lock.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.9.31-generated-package-lock
          path: generated-package-lock.json
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test phone and desktop HUD
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 0.5
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=432,960 --screenshot=helix-mobile-smoke.png --dump-dom http://127.0.0.1:4173/ > helix-mobile-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=1280,720 --screenshot=helix-desktop-smoke.png http://127.0.0.1:4173/ > /dev/null
          grep -q 'F.R.I.D.A.Y.' helix-mobile-dom.html
          grep -q 'HELIX OPS' helix-mobile-dom.html
          grep -q 'BUILD 0.9.31' helix-mobile-dom.html
          grep -q 'RESPONSE TERMINAL' helix-mobile-dom.html
          grep -q 'response-scroll' helix-mobile-dom.html
          grep -q 'weather-glyph' helix-mobile-dom.html
          if grep -Eq '[⚠☂❄☁☼⛈]' helix-ui/src/Hud.tsx; then exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare production signing material
        id: signing
        shell: bash
        env:
          FRIDAY_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
          FRIDAY_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.FRIDAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$FRIDAY_KEYSTORE_BASE64" && -n "$FRIDAY_KEYSTORE_PASSWORD" && -n "$FRIDAY_KEY_ALIAS" && -n "$FRIDAY_KEY_PASSWORD" ]]; then
            mkdir -p .signing
            printf '%s' "$FRIDAY_KEYSTORE_BASE64" | base64 --decode > .signing/friday-release.jks
            chmod 600 .signing/friday-release.jks
            test -s .signing/friday-release.jks
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, unit-test, and assemble debug and release variants
        shell: bash
        env:
          FRIDAY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/friday-release.jks
          FRIDAY_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.FRIDAY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-build.log

      - name: Verify hardened release package
        id: verify
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$RELEASE_APK" 2>&1 | tee apk-zipalign.log
          "$BUILD_TOOLS/aapt" dump badging "$RELEASE_APK" | tee apk-badging.log
          "$BUILD_TOOLS/aapt" dump permissions "$RELEASE_APK" | tee apk-permissions.log
          unzip -l "$RELEASE_APK" | tee apk-contents.log
          grep -q "package: name='com.seongja.jarvis'" apk-badging.log
          grep -q "versionName='0.9.31-hardening'" apk-badging.log
          grep -q "application-label:'F.R.I.D.A.Y.'" apk-badging.log
          if grep -q 'application-debuggable' apk-badging.log; then
            echo 'Release APK is incorrectly debuggable.' >&2
            exit 1
          fi
          grep -q 'android.permission.RECORD_AUDIO' apk-permissions.log
          grep -q 'android.permission.USE_BIOMETRIC' apk-permissions.log
          grep -q 'classes.dex' apk-contents.log
          grep -q 'assets/helix/index.html' apk-contents.log
          grep -q 'class OwnerAccessGateActivity' app/src/main/java/com/seongja/jarvis/OwnerAccessGateActivity.kt
          grep -q 'FLAG_SECURE' app/src/main/java/com/seongja/jarvis/OwnerAccessController.kt
          grep -q 'dataExtractionRules' app/src/main/AndroidManifest.xml
          grep -q 'mayAuthorizeSensitiveAction(): Boolean = false' app/src/main/java/com/seongja/jarvis/OwnerVoiceRuntime.kt
          grep -q 'class RuntimeSmokeTest' app/src/androidTest/java/com/seongja/jarvis/RuntimeSmokeTest.kt

          mkdir -p release
          if [[ "$SIGNING_CONFIGURED" == "true" ]]; then
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK" 2>&1 | tee apk-signature.log
            cp "$RELEASE_APK" release/FRIDAY-0.9.31-Hardened.apk
            sha256sum release/FRIDAY-0.9.31-Hardened.apk > release/FRIDAY-0.9.31-Hardened.apk.sha256
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            if "$BUILD_TOOLS/apksigner" verify "$RELEASE_APK" > apk-signature.log 2>&1; then
              echo 'Unsigned validation build unexpectedly has a signing certificate.' >&2
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require permanent signing before publishing main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test "${{ steps.verify.outputs.signed }}" = "true" || {
            echo 'Main release blocked: configure the four FRIDAY signing secrets first.' >&2
            exit 1
          }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.9.31-hardening-validation-logs
          path: |
            helix-build.log
            helix-server.log
            helix-mobile-dom.html
            helix-mobile-smoke.png
            helix-desktop-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified signed APK
        if: success() && steps.verify.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-Helix-0.9.31-Hardened-apk
          path: |
            release/FRIDAY-0.9.31-Hardened.apk
            release/FRIDAY-0.9.31-Hardened.apk.sha256
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Launch FRIDAY on Android 16
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          disable-spellchecker: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload Android runtime report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.9.31-android16-runtime-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish signed FRIDAY release
    needs:
      - build
      - runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v6
        with:
          name: FRIDAY-Helix-0.9.31-Hardened-apk
          path: release

      - name: Publish stable FRIDAY release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.9.31-hardening"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag --yes; fi
          gh release create "$TAG" release/FRIDAY-0.9.31-Hardened.apk release/FRIDAY-0.9.31-Hardened.apk.sha256 --target "$GITHUB_SHA" --title "F.R.I.D.A.Y. 0.9.31 // Hardened Release" --notes "Production release with persistent signing support, Android 16 targeting, owner-gated credential consoles, backup exclusion, deterministic HELIX dependencies, unit tests, browser smoke tests, and an Android 16 emulator launch test."
