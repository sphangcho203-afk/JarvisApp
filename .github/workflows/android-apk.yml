name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate WeatherAPI intelligence APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package.json

      - name: Build weather-aware Helix interface
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee ../helix-build.log
          cd ..

          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          test -n "$(find app/src/main/assets/helix/assets -name '*.js' -type f -print -quit)"
          test -n "$(find app/src/main/assets/helix/assets -name '*.css' -type f -print -quit)"

      - name: Smoke-test weather-aware Helix
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 0.5
          done
          test "$READY" = 1
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=swiftshader \
            --enable-webgl \
            --virtual-time-budget=7000 \
            --window-size=1280,720 \
            --screenshot=helix-smoke.png \
            --dump-dom \
            http://127.0.0.1:4173/ > helix-dom.html
          grep -q 'BUILD 0.9.20' helix-dom.html
          grep -q 'CONNECT WEATHERAPI' helix-dom.html
          grep -q 'LATEST VERIFIED RESPONSE' helix-dom.html
          if grep -q 'TYPE COMMAND' helix-dom.html || grep -q '>SEND<' helix-dom.html; then
            echo 'Chat input controls are still present.' >&2
            exit 1
          fi
          if grep -q 'RENDER FALLBACK ONLINE' helix-dom.html; then
            echo 'Helix entered render fallback.' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2

      - name: Lint, test, and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            --stacktrace \
            --warning-mode all \
            --no-daemon 2>&1 | tee android-build.log

      - name: Verify intelligent weather APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" 2>&1 | tee apk-signature.log
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" 2>&1 | tee apk-zipalign.log
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee apk-badging.log
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.log
          unzip -l "$APK" | tee apk-contents.log

          grep -q "package: name='com.seongja.jarvis'" apk-badging.log
          grep -q "versionName='0.9.20-weather-intelligence'" apk-badging.log
          grep -q "sdkVersion:'28'" apk-badging.log
          grep -q "targetSdkVersion:'35'" apk-badging.log
          grep -q "android.permission.INTERNET" apk-permissions.log
          grep -q 'classes.dex' apk-contents.log
          grep -q 'assets/helix/index.html' apk-contents.log

          grep -q 'FORECAST_ENDPOINT = "https://api.weatherapi.com/v1/forecast.json"' app/src/main/java/com/seongja/jarvis/WeatherSettings.kt
          grep -q 'alerts", "yes"' app/src/main/java/com/seongja/jarvis/WeatherApiClient.kt
          grep -q 'class SecureWeatherRegistry' app/src/main/java/com/seongja/jarvis/SecureWeatherRegistry.kt
          grep -q 'class WeatherSetupActivity' app/src/main/java/com/seongja/jarvis/WeatherSetupActivity.kt
          grep -q 'WeatherSetupActivity' app/src/main/AndroidManifest.xml
          grep -q 'WeatherRuntime.addListener(weatherListener)' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'WeatherRuntime.answer(clean)' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'consumeAdvisory' app/src/main/java/com/seongja/jarvis/WeatherIntelligence.kt
          grep -q 'getWeatherJson' app/src/main/java/com/seongja/jarvis/JarvisApplication.kt
          grep -q 'CONNECT WEATHERAPI' helix-ui/src/Hud.tsx
          grep -q 'getWeatherJson' helix-ui/src/nativeBridge.ts

          # Preserve Android control and Cartesia/cortex streaming systems.
          grep -q 'class PermissionCenterActivity' app/src/main/java/com/seongja/jarvis/PermissionCenterActivity.kt
          grep -q 'MODEL_ID = "sonic-3"' app/src/main/java/com/seongja/jarvis/CartesiaVoiceSettings.kt
          grep -q 'AudioTrack.MODE_STREAM' app/src/main/java/com/seongja/jarvis/CartesiaSonicClient.kt
          grep -q 'streamGenerateContent?alt=sse' app/src/main/java/com/seongja/jarvis/CortexStreamingTransport.kt
          grep -q 'put("stream", true)' app/src/main/java/com/seongja/jarvis/CortexStreamingTransport.kt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-0.9.20-weather-validation-logs
          path: |
            helix-build.log
            helix-server.log
            helix-dom.html
            helix-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Jarvis-Helix-0.9.20-Weather-Intelligence-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
