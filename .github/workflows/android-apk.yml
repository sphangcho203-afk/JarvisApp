name: Build FRIDAY Sensory Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/complete-hardening-0.9.31
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: friday-sensory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FRIDAY_VERSION: 0.10.0

jobs:
  build:
    name: Build and inspect FRIDAY 0.10.0
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      signed: ${{ steps.verify.outputs.signed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify committed source integrations are stable
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/finalize_sensory_source.py
          python3 scripts/run_pending_integrations.py
          git diff --exit-code

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: helix-ui/package-lock.json

      - name: Build locked HELIX interface
        shell: bash
        run: |
          set -euo pipefail
          cd helix-ui
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tee ../helix-build.log
          cd ..
          rm -rf app/src/main/assets/helix
          mkdir -p app/src/main/assets/helix
          cp -R helix-ui/dist/. app/src/main/assets/helix/
          test -s app/src/main/assets/helix/index.html
          grep -q 'X-CAMERA' helix-ui/src/WorkspaceRail.tsx
          grep -q 'VISUAL LAB' helix-ui/src/WorkspaceRail.tsx
          grep -q 'PRIVATE DIARY' helix-ui/src/WorkspaceRail.tsx
          grep -q 'onOpen' helix-ui/src/WorkspaceRail.tsx

      - name: Smoke-test phone and desktop HELIX
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m http.server 4173 --directory helix-ui/dist > helix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .5; done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=432,960 --screenshot=helix-mobile-smoke.png --dump-dom http://127.0.0.1:4173/ > helix-mobile-dom.html
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-webgl --virtual-time-budget=7000 --window-size=1280,720 --screenshot=helix-desktop-smoke.png http://127.0.0.1:4173/ >/dev/null
          grep -q 'F.R.I.D.A.Y.' helix-mobile-dom.html
          grep -q 'X-CAMERA' helix-mobile-dom.html
          grep -q 'VISUAL LAB' helix-mobile-dom.html
          grep -q 'PRIVATE DIARY' helix-mobile-dom.html
          grep -q 'MEMORY VAULT' helix-mobile-dom.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare permanent signing material
        id: signing
        shell: bash
        env:
          FRIDAY_KEYSTORE_BASE64: ${{ secrets.FRIDAY_KEYSTORE_BASE64 }}
          FRIDAY_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.FRIDAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$FRIDAY_KEYSTORE_BASE64" && -n "$FRIDAY_KEYSTORE_PASSWORD" && -n "$FRIDAY_KEY_ALIAS" && -n "$FRIDAY_KEY_PASSWORD" ]]; then
            mkdir -p .signing
            printf '%s' "$FRIDAY_KEYSTORE_BASE64" | base64 --decode > .signing/friday-release.jks
            chmod 600 .signing/friday-release.jks
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, test, and assemble both variants
        shell: bash
        env:
          FRIDAY_KEYSTORE_PATH: ${{ github.workspace }}/.signing/friday-release.jks
          FRIDAY_KEYSTORE_PASSWORD: ${{ secrets.FRIDAY_KEYSTORE_PASSWORD }}
          FRIDAY_KEY_ALIAS: ${{ secrets.FRIDAY_KEY_ALIAS }}
          FRIDAY_KEY_PASSWORD: ${{ secrets.FRIDAY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --warning-mode all --no-daemon 2>&1 | tee android-build.log

      - name: Verify native sensory package
        id: verify
        shell: bash
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$RELEASE_APK"
          "$TOOLS/zipalign" -c -v 4 "$RELEASE_APK" 2>&1 | tee apk-zipalign.log
          "$TOOLS/aapt" dump badging "$RELEASE_APK" | tee apk-badging.log
          "$TOOLS/aapt" dump permissions "$RELEASE_APK" | tee apk-permissions.log
          unzip -l "$RELEASE_APK" | tee apk-contents.log
          grep -q "versionName='0.10.0-sensory-core'" apk-badging.log
          grep -q "application-label:'F.R.I.D.A.Y.'" apk-badging.log
          ! grep -q 'application-debuggable' apk-badging.log
          grep -q 'android.permission.CAMERA' apk-permissions.log
          grep -q 'assets/helix/index.html' apk-contents.log
          grep -q 'class XCameraActivity' app/src/main/java/com/seongja/jarvis/XCameraActivity.kt
          grep -q 'class GeminiVisionClient' app/src/main/java/com/seongja/jarvis/GeminiVisionClient.kt
          grep -q 'class FridayWorkspaceVoice' app/src/main/java/com/seongja/jarvis/FridayWorkspaceVoice.kt
          grep -q 'spokenInWorkspace' app/src/main/java/com/seongja/jarvis/XCameraActivity.kt
          grep -q 'consumeXCameraResult' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'FridayWorkspaceReservation' app/src/main/java/com/seongja/jarvis/MainActivity.kt
          grep -q 'openWorkspace' app/src/main/java/com/seongja/jarvis/HelixHudView.kt
          grep -q 'open your eyes' app/src/main/java/com/seongja/jarvis/FridayVisionRouter.kt
          grep -q 'class ImageGenerationActivity' app/src/main/java/com/seongja/jarvis/ImageGenerationActivity.kt
          grep -q 'class PrivateDiaryActivity' app/src/main/java/com/seongja/jarvis/PrivateDiaryActivity.kt
          mkdir -p release
          if [[ "$SIGNING_CONFIGURED" == 'true' ]]; then
            "$TOOLS/apksigner" verify --verbose --print-certs "$RELEASE_APK" 2>&1 | tee apk-signature.log
            cp "$RELEASE_APK" release/FRIDAY-0.10.0-Sensory-Core.apk
            sha256sum release/FRIDAY-0.10.0-Sensory-Core.apk > release/FRIDAY-0.10.0-Sensory-Core.apk.sha256
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            if "$TOOLS/apksigner" verify "$RELEASE_APK" > apk-signature.log 2>&1; then
              echo 'Unsigned validation build unexpectedly has a certificate.' >&2
              exit 1
            fi
            echo 'signed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.10.0-sensory-validation
          path: |
            helix-build.log
            helix-server.log
            helix-mobile-dom.html
            helix-mobile-smoke.png
            helix-desktop-smoke.png
            android-build.log
            apk-signature.log
            apk-zipalign.log
            apk-badging.log
            apk-permissions.log
            apk-contents.log
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed APK
        if: success() && steps.verify.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.10.0-signed-apk
          path: release/
          if-no-files-found: error
          retention-days: 30

  runtime:
    name: Launch FRIDAY on Android 16
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FRIDAY-0.10.0-android16-runtime
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
